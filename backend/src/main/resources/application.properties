spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartwash_pro?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:SmartWashProSecretKey2024VeryLongSecureKeyForJWT}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false
